<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โปรแกรมคำนวณดวงชะตาประจำปีเกิด (ตำราโบราณ)</title>
<style>
    * {
        box-sizing: border-box;
        font-family: 'Sarabun', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .card {
        background-color: #ffffff;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 480px;
        border: 2px solid #d4af37;
    }
    h2 {
        color: #8b0000;
        text-align: center;
        margin-top: 0;
        margin-bottom: 8px;
    }
    p.subtitle {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 24px;
    }
    .form-group {
        margin-bottom: 18px;
    }
    label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #333;
    }
    select, input[type="number"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
    }
    select:focus, input[type="number"]:focus {
        border-color: #d4af37;
        box-shadow: 0 0 5px rgba(212, 175, 55, 0.5);
    }
    .gender-options {
        display: flex;
        gap: 15px;
    }
    .gender-label {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }
    .gender-label input {
        margin-right: 8px;
    }
    .btn {
        width: 100%;
        padding: 12px;
        background-color: #8b0000;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 10px;
    }
    .btn:hover {
        background-color: #a00000;
    }
    .result-box {
        margin-top: 24px;
        padding: 20px;
        border-radius: 10px;
        background-color: #fffdf0;
        border: 1px solid #e6d283;
        display: none;
    }
    .result-title {
        font-size: 20px;
        font-weight: bold;
        color: #8b0000;
        margin-bottom: 8px;
        text-align: center;
    }
    .result-desc {
        color: #444;
        line-height: 1.6;
    }
</style>
</head>
<body>

<div class="card">
    <h2>ทำนายดวงชะตาประจำปีเกิด</h2>
    <p class="subtitle">คำนวณตามตำราวนรอบเจดีย์โบราณ</p>

    <form id="horoForm">
        <div class="form-group">
            <label>เพศ</label>
            <div class="gender-options">
                <label class="gender-label">
                    <input type="radio" name="gender" value="male" checked> ชาย
                </label>
                <label class="gender-label">
                    <input type="radio" name="gender" value="female"> หญิง
                </label>
            </div>
        </div>

        <div class="form-group">
            <label for="age">อายุย่าง (ปีนี้อายุเท่าไหร่):</label>
            <input type="number" id="age" min="1" max="120" placeholder="ระบุอายุ เช่น 25" required>
        </div>

        <button type="button" class="btn" onclick="calculateHoro()">ทำนายดวงชะตา</button>
    </form>

    <div class="result-box" id="resultBox">
        <div class="result-title" id="resultTitle"></div>
        <div class="result-desc" id="resultDesc"></div>
    </div>
</div>

<script>
// ข้อมูลคำทำนายตามตำแหน่งทั้ง 12
const horoData = {
    1: { name: "เจดีย์", desc: "ตกเจดีย์ ชะตาชีวิตจะมีความสุขความเจริญ สติปัญญาดี มีผู้ใหญ่คอยอุปถัมภ์ค้ำชู ทำการใดมักจะประสบความสำเร็จ โชคลาภราบรื่น" },
    2: { name: "ฉัตรเงิน", desc: "ตกฉัตรเงิน ชะตาจะได้ลาภยศสรรเสริญ การงานเจริญก้าวหน้า มีคนเคารพนับถือ จะได้โชคลาภเป็นข้าวของเงินทอง" },
    3: { name: "คอขาด", desc: "ตกรอบคอขาด ให้ระมัดระวังเรื่องอุบัติเหตุ เครียด คดีความ หรือสุขภาพร่างกาย ควรระวังเรื่องการใช้ชีวิตและตั้งตนอยู่ในความไม่ประมาท" },
    4: { name: "เรือนหลวง", desc: "ตกเรือนหลวง ชีวิตมีความเป็นอยู่มั่นคง การงานมีเกียรติ ยศถาบรรดาศักดิ์ได้รับการยอมรับ จะได้รับการอุปถัมภ์จากผู้ใหญ่" },
    5: { name: "ปราสาท", desc: "ตกปราสาท ชะตามีความสุขสมบูรณ์ จะได้ที่อยู่อาศัยหรือทรัพย์สินใหม่ ทำมาค้าขึ้น โชคลาภหลั่งไหลเข้ามา" },
    6: { name: "ราหู", desc: "ตกราหู ให้ระวังอุปสรรค ปัญหาความวุ่นวายใจ ถูกใส่ร้ายป้ายสี หรือเสียทรัพย์โดยไม่จำเป็น ควรทำบุญตักบาตรและระวังเรื่องอารมณ์" },
    7: { name: "ฉัตรทอง", desc: "ตกฉัตรทอง มหาโชค มหาลาภ จะได้ลาภยศสรรเสริญ ประสบความสำเร็จในชีวิตระดับสูง มีเกียรติยศชื่อเสียง" },
    8: { name: "เทวดาขี่เต่า", desc: "ตกเทวดาขี่เต่า โชคลาภอาจจะมาอย่างช้าๆ แต่มาแบบมั่นคง เดินทางปลอดภัย มีคนคอยช่วยเหลือค้ำชูอยู่เสมอ" },
    9: { name: "คนต้องตรวน (คนต้องข้อขา)", desc: "ตกคนต้องตรวน ระวังติดขัด ถูกอุปสรรคคอยขัดขวาง ทำอะไรอาจรู้สึกติดขัดไม่คล่องตัว ให้ระวังเรื่องการรับประกันหรือคดีความ" },
    10: { name: "พ่อหมอ", desc: "ตกพ่อหมอ จะได้ความรู้ ปัญญา หรือมีคนมาขอคำปรึกษา เป็นปีที่ดวงชะตาเข้มแข็ง เหมาะแก่การเรียนรู้และสั่งสมประสบการณ์" },
    11: { name: "แม่มด", desc: "ตกแม่มด ระวังผู้ใหญ่หรือเพศตรงข้ามให้โทษ ถูกหลอกลวง ให้ระวังการผูกมิตรกับคนแปลกหน้า แนะนำให้ทำบุญถวายสังฆทาน" },
    12: { name: "นาคราช", desc: "ตกนาคราช มีอำนาจ บารมี จะได้ลาภจากทางไกลหรือสิ่งศักดิ์สิทธิ์ แต่ให้ระวังเรื่องการหมุนเวียนเงินและอารมณ์ฉุนเฉียว" }
};

function calculateHoro() {
    const ageInput = document.getElementById("age").value;
    const gender = document.querySelector('input[name="gender"]:checked').value;
    
    if (!ageInput || ageInput < 1) {
        alert("กรุณากรอกอายุที่ถูกต้อง");
        return;
    }

    const age = parseInt(ageInput);
    let positionIndex;

    // คำนวณตำแหน่ง (1-12)
    // เริ่มที่ 1 (เจดีย์) 
    if (gender === "male") {
        // ชาย นับเวียนขวา (1 -> 2 -> 3 -> ... -> 12)
        positionIndex = (age % 12);
        if (positionIndex === 0) positionIndex = 12;
    } else {
        // หญิง นับเวียนซ้าย (1 -> 12 -> 11 -> ... -> 2)
        positionIndex = (1 - (age - 1)) % 12;
        if (positionIndex <= 0) positionIndex += 12;
    }

    // ดึงข้อมูลคำทำนาย
    const result = horoData[positionIndex];

    // แสดงผลลัพธ์
    document.getElementById("resultTitle").innerText = "ตกตำแหน่ง: " + result.name;
    document.getElementById("resultDesc").innerText = result.desc;
    document.getElementById("resultBox").style.display = "block";
}
</script>
<title> Insert Images :ตำแหน่งและเส้นขอบรูปภาพ </title></head>
<body>
<div align="center"> ตำแหน่งและเส้นขอบรูปภาพ<br>
<img src="กูดวง.jpg" width="728" height="968" border="3"></div>
</body>
</html>
